<!--
  Northsaga mark, draw variant — PLACEHOLDER GEOMETRY. See mark.svg.

  This is the reference source for the mark inlined into each page's header.
  It must be inline in the HTML for CSS to animate the strokes, so the markup
  is duplicated there deliberately. If the geometry changes, change it here
  first, then propagate to every page header.

  Each path carries pathLength="1" so the draw animation can use a normalised
  stroke-dasharray of 1 regardless of the real path length. Keep that
  attribute on any replacement artwork.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" fill="none"
     stroke="currentColor" stroke-width="11" stroke-linecap="butt"
     role="img" aria-label="Northsaga">
  <path class="mark__stroke" style="--i:0" pathLength="1" d="M12 116 V 52" />
  <path class="mark__stroke" style="--i:1" pathLength="1" d="M12 52 L 50 6" />
  <path class="mark__stroke" style="--i:2" pathLength="1" d="M50 6 L 88 52" />
  <path class="mark__stroke" style="--i:3" pathLength="1" d="M88 52 V 116" />
</svg>
